<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coucou">
  <link rel="manifest" href="/manifest.json">
  <title>Coucou Companion</title>
  <link rel="stylesheet" href="./src/companion/style.css">
</head>
<body class="bg-black text-white antialiased select-none overflow-hidden touch-none">
  <div id="app" class="flex flex-col h-screen w-screen px-4 pt-safe pb-safe">
    <!-- Dynamic Island Container -->
    <header id="dynamic-island" class="flex justify-center pt-3 pb-2">
      <div class="island-pill flex items-center justify-between px-4 py-2 bg-neutral-900 border border-neutral-800 rounded-full w-full max-w-xs shadow-2xl">
        <canvas id="mochi-canvas" width="36" height="36" class="rounded-full"></canvas>
        <span id="island-status" class="text-xs font-medium tracking-wide text-neutral-300">Coucou Ready</span>
        <div id="battery-indicator" class="flex items-center space-x-1 text-xs text-neutral-400">
          <span id="battery-level">100%</span>
        </div>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="flex justify-around my-2 border-b border-neutral-900 pb-2">
      <button data-tab="music" class="tab-btn active text-sm font-semibold text-white px-3 py-1">Music</button>
      <button data-tab="agent" class="tab-btn text-sm font-semibold text-neutral-500 px-3 py-1">Antigravity</button>
      <button data-tab="chat" class="tab-btn text-sm font-semibold text-neutral-500 px-3 py-1">Remote Chat</button>
    </nav>

    <!-- Main Viewport -->
    <main id="tab-content" class="flex-1 relative overflow-hidden">
      <!-- Music Tab -->
      <section id="tab-music" class="tab-pane active flex flex-col h-full">
        <div id="media-card" class="flex items-center space-x-4 p-3.5 bg-neutral-950 rounded-2xl border border-neutral-900 shadow-lg">
          <div id="album-art-wrap" class="relative w-16 h-16 rounded-xl bg-neutral-900 flex items-center justify-center overflow-hidden shadow-lg border border-neutral-800 shrink-0">
            <svg id="album-art-placeholder" class="w-8 h-8 text-neutral-600" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <img id="album-art" src="" alt="Cover" class="hidden absolute inset-0 w-full h-full object-cover" />
          </div>
          <div class="flex-1 min-w-0">
            <h2 id="track-title" class="text-base font-bold truncate text-white">No Track Playing</h2>
            <p id="track-artist" class="text-xs text-neutral-400 truncate">Connect to Coucou</p>
          </div>
        </div>

        <!-- Karaoke Scrolling Lyrics -->
        <div id="lyrics-container" class="flex-1 overflow-y-auto my-4 text-center space-y-4 px-2 scroll-smooth">
          <p class="text-neutral-600 text-sm italic">Waiting for music...</p>
        </div>

        <!-- Playback Controls -->
        <div class="flex items-center justify-around py-4 px-6 bg-neutral-950/80 backdrop-blur rounded-2xl border border-neutral-900 shadow-xl">
          <button id="btn-prev" class="control-btn" aria-label="Previous Track">
            <svg class="control-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 4a1 1 0 0 1 1 1v5.618l9.447-6.043A1 1 0 0 1 18 5.418v13.164a1 1 0 0 1-1.553.843L7 13.382V19a1 1 0 0 1-2 0V5a1 1 0 0 1 1-1z"/>
            </svg>
          </button>
          <button id="btn-play" class="play-btn" aria-label="Play or Pause">
            <svg id="icon-play" class="control-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 4.232a1 1 0 0 1 1.504-.864l12.222 7.071a1 1 0 0 1 0 1.722L8.504 19.232A1 1 0 0 1 7 18.368V4.232z"/>
            </svg>
            <svg id="icon-pause" class="control-icon hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 5a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5zm9 0a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2V5z"/>
            </svg>
          </button>
          <button id="btn-next" class="control-btn" aria-label="Next Track">
            <svg class="control-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 4a1 1 0 0 0-1 1v5.618L7.553 4.575A1 1 0 0 0 6 5.418v13.164a1 1 0 0 0 1.553.843L17 13.382V19a1 1 0 0 0 2 0V5a1 1 0 0 0-1-1z"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- Antigravity Tab -->
      <section id="tab-agent" class="tab-pane hidden flex flex-col h-full justify-between p-2">
        <div id="agent-status-card" class="p-4 bg-neutral-950 rounded-2xl border border-neutral-900">
          <span class="text-xs uppercase font-semibold text-neutral-500">Agent Status</span>
          <h3 id="agent-state-label" class="text-lg font-bold text-emerald-400 mt-1">Idle</h3>
          <p id="agent-goal" class="text-sm text-neutral-300 mt-2">No active tasks</p>
        </div>

        <!-- Approval Prompt Card -->
        <div id="approval-card" class="hidden p-5 bg-neutral-900 rounded-3xl border border-neutral-700 shadow-2xl space-y-4">
          <span class="text-xs font-bold uppercase text-amber-400 tracking-wider">Action Approval Required</span>
          <p id="approval-prompt-text" class="text-sm font-medium text-white"></p>
          <div class="flex space-x-3 pt-2">
            <button id="btn-deny" class="flex-1 py-3 bg-red-600 active:bg-red-700 text-white font-bold rounded-xl active:scale-95 transition-transform">Deny</button>
            <button id="btn-allow" class="flex-1 py-3 bg-emerald-500 active:bg-emerald-600 text-black font-bold rounded-xl active:scale-95 transition-transform">Allow</button>
          </div>
        </div>
      </section>

      <!-- Remote Chat Tab -->
      <section id="tab-chat" class="tab-pane hidden flex flex-col h-full justify-between">
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 p-3 scroll-smooth">
          <div class="chat-bubble flex items-start space-x-2.5">
            <div class="w-7 h-7 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center shrink-0 shadow">
              <svg class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v2"/><rect x="4" y="4" width="16" height="14" rx="3"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M9 15h6"/>
              </svg>
            </div>
            <div class="bg-neutral-950 border border-neutral-800 rounded-2xl rounded-tl-sm p-3 text-xs text-neutral-300 shadow leading-relaxed max-w-[85%]">
              Connected to laptop! Type any message below to chat with your AI or copy prompts directly to your Windows clipboard.
            </div>
          </div>
        </div>

        <!-- Input Controls -->
        <div class="p-3 bg-neutral-950/90 backdrop-blur border-t border-neutral-900 flex flex-col space-y-2">
          <div class="flex items-center space-x-2 text-[11px]">
            <button id="btn-mode-ai" type="button" class="mode-pill active px-3 py-1 rounded-full border border-emerald-500/50 bg-emerald-500/15 text-emerald-400 font-medium transition-all flex items-center space-x-1.5">
              <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              <span>Ask AI</span>
            </button>
            <button id="btn-mode-clip" type="button" class="mode-pill px-3 py-1 rounded-full border border-neutral-800 bg-neutral-900 text-neutral-400 font-medium transition-all flex items-center space-x-1.5">
              <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copy to PC</span>
            </button>
            <span id="chat-status-toast" class="text-[11px] text-emerald-400 ml-auto hidden font-medium">Copied!</span>
          </div>
          <form id="chat-form" class="flex items-center space-x-2">
            <input id="chat-input" type="text" placeholder="Type prompt or message..." class="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-600 transition-colors" autocomplete="off" />
            <button id="btn-chat-send" type="submit" class="p-2.5 bg-white active:bg-neutral-200 text-black rounded-xl font-bold active:scale-95 transition-transform shrink-0 shadow" aria-label="Send">
              <svg class="control-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./src/companion/main.ts"></script>
</body>
</html>
